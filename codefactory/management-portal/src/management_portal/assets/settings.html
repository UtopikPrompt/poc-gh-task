<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LangGraph configuration</title>
    <link rel="stylesheet" href="/management-portal/assets/portal.css">
    <script src="/management-portal/assets/settings.js" defer></script>
</head>

<body class="settings-page">
    <main class="settings-shell">
        <header>
            <div class="header-top">
                <h1>LangGraph configuration</h1>
                <div class="header-actions">
                    <form action="/auth/logout" method="post"><button type="submit">Sign out</button></form>
                </div>
            </div>
            <nav class="primary-nav" aria-label="Primary navigation">
                <a href="/">Dashboard</a>
                <a href="/settings" aria-current="page">LangGraph</a>
                <a href="/inference">Inference</a>
            </nav>
        </header>
        <section class="settings-section roster-section" aria-labelledby="agent-roster-heading">
            <div class="roster-heading">
                <h2 id="agent-roster-heading">Agent roster</h2>
                <div class="roster-status">
                    <p id="roster-message" role="status" aria-live="polite" data-state="loading">Loading roster...</p>
                    <p id="roster-audit" class="audit-line"></p>
                </div>
            </div>
            <form id="agent-roster-form">
                <div id="roster-summary" class="roster-editor"></div>
                <div class="roster-actions">
                    <div class="add-profile-control">
                        <label for="add-profile-role">Add profile for</label>
                        <select id="add-profile-role" name="add_profile_role">
                            <option value="context">Context</option>
                            <option value="planning">Planning</option>
                            <option value="risk">Risk</option>
                            <option value="implementation">Implementation</option>
                            <option value="repair">Repair</option>
                        </select>
                        <button id="add-profile" type="button">Add profile</button>
                    </div>
                    <button id="save-roster" class="primary-action" type="submit" disabled>Save roster</button>
                </div>
            </form>
            <p class="roster-note">Skill IDs are metadata only; the LangGraph service does not load or execute them.</p>
        </section>
        <section class="settings-section runtime-section" aria-labelledby="agent-config-heading">
            <h2 id="agent-config-heading">Runtime settings</h2>
            <form id="agent-config-form">
                <label for="completion-timeout">Local model timeout (seconds)</label>
                <div class="config-controls">
                    <input id="completion-timeout" name="completion_timeout_seconds" type="number" min="1" max="90"
                        step="1" required>
                    <button id="save-config" type="submit" disabled>Save configuration</button>
                </div>
            </form>
            <div class="runtime-feedback">
                <p id="config-message" role="status" aria-live="polite" data-state="loading">Loading configuration...
                </p>
                <p id="config-audit" class="audit-line"></p>
            </div>
        </section>
    </main>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>

</html>

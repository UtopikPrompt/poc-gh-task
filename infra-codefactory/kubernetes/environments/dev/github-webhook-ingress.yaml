apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-webhook
  namespace: codefactory
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: codefactory.utopiklab.com
    http:
      paths:
      - path: /
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000
      - path: /api/workflows
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000
      - path: /auth/login
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000
      - path: /auth/callback
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000
      - path: /auth/logout
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000
      - path: /webhooks/github
        pathType: Exact
        backend:
          service:
            name: github-service
            port:
              number: 8000

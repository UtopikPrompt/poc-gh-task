apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codefactory
resources:
- ../../bases/platform
- ../../bases/github-service
- ../../bases/langgraph-service
- ../../bases/management-portal
- github-webhook-ingress.yaml
- storage.yaml
patches:
- path: database-config.yaml
- path: postgres-storage.yaml
- path: local-image-pull-policy.yaml
images:
- name: codefactory/github-service
  newName: ghcr.io/utopikprompt/poc-gh-task-github-service
  newTag: dev
- name: codefactory/langgraph-service
  newName: ghcr.io/utopikprompt/poc-gh-task-langgraph-service
  newTag: dev
- name: codefactory/management-portal
  newName: ghcr.io/utopikprompt/poc-gh-task-management-portal
  newTag: dev

apiVersion: v1
kind: ConfigMap
metadata:
  name: codefactory-service-config
data:
  GITHUB_SERVICE_URL: http://github-service:8000
  LANGGRAPH_SERVICE_URL: http://langgraph-service:8001
  LLAMA_CPP_URL: http://llama-cpp-server.inference.svc.cluster.local:8080
  PROMETHEUS_URL: http://prometheus.inference.svc.cluster.local:9090
  WORKFLOW_OPERATIONS_MODULE: langgraph_service.workflow.workflow_operations
  WORKER_POLL_SECONDS: "1"

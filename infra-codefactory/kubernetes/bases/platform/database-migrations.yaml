apiVersion: batch/v1
kind: Job
metadata:
  name: codefactory-database-migrations
  labels:
    app.kubernetes.io/name: codefactory-database-migrations
    app.kubernetes.io/part-of: codefactory
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codefactory-database-migrations
        app.kubernetes.io/part-of: codefactory
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: copy-github-migrations
        image: codefactory/github-service:dev
        imagePullPolicy: Always
        command: [ "sh", "-ec" ]
        args:
        - cp /app/migrations/001_github_event_queue.sql /migrations/001_github_event_queue.sql && cp /app/migrations/002_service_roles.sql /migrations/002_service_roles.sql && cp /app/migrations/003_github_task_installation.sql /migrations/003_github_task_installation.sql && cp /app/migrations/004_github_project_identity.sql /migrations/004_github_project_identity.sql
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      - name: copy-langgraph-migration
        image: codefactory/langgraph-service:dev
        imagePullPolicy: Always
        command: [ "sh", "-ec" ]
        args:
        - cp /app/migrations/001_checkpoint_schema.sql /migrations/001_checkpoint_schema.sql
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      containers:
      - name: migrate
        image: codefactory/langgraph-service:dev
        imagePullPolicy: Always
        command: [ "python", "-m", "langgraph_service.migrate" ]
        envFrom:
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: POSTGRES_ADMIN_PASSWORD
        - name: GITHUB_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: GITHUB_DB_PASSWORD
        - name: LANGGRAPH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: LANGGRAPH_DB_PASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      volumes:
      - name: migrations
        emptyDir:
          sizeLimit: 16Mi

apiVersion: batch/v1
kind: Job
metadata:
  name: codefactory-database-migrations
  labels:
    app.kubernetes.io/name: codefactory-database-migrations
    app.kubernetes.io/part-of: codefactory
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codefactory-database-migrations
        app.kubernetes.io/part-of: codefactory
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: copy-github-migrations
        image: codefactory/github-service:dev
        imagePullPolicy: Always
        command: [ "sh", "-ec" ]
        args:
        - cp /app/migrations/001_github_event_queue.sql /migrations/001_github_event_queue.sql && cp /app/migrations/002_service_roles.sql /migrations/002_service_roles.sql && cp /app/migrations/003_github_task_installation.sql /migrations/003_github_task_installation.sql && cp /app/migrations/004_github_project_identity.sql /migrations/004_github_project_identity.sql && cp /app/migrations/005_github_review_event.sql /migrations/005_github_review_event.sql && cp /app/migrations/006_github_human_feedback_reply.sql /migrations/006_github_human_feedback_reply.sql && cp /app/migrations/007_github_agent_repair_requested.sql /migrations/007_github_agent_repair_requested.sql
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      - name: copy-langgraph-migration
        image: codefactory/langgraph-service:dev
        imagePullPolicy: Always
        command: [ "sh", "-ec" ]
        args:
        - cp /app/migrations/001_checkpoint_schema.sql /migrations/001_checkpoint_schema.sql && cp /app/migrations/002_agent_config.sql /migrations/002_agent_config.sql && cp /app/migrations/003_agent_roster.sql /migrations/003_agent_roster.sql && cp /app/migrations/008_langgraph_model_profile.sql /migrations/008_langgraph_model_profile.sql && cp /app/migrations/009_inference_instance_config.sql /migrations/009_inference_instance_config.sql && cp /app/migrations/010_inference_model_downloads.sql /migrations/010_inference_model_downloads.sql && cp /app/migrations/011_inference_model_rollouts.sql /migrations/011_inference_model_rollouts.sql && cp /app/migrations/012_multiple_inference_instances.sql /migrations/012_multiple_inference_instances.sql && cp /app/migrations/013_global_model_downloads.sql /migrations/013_global_model_downloads.sql && cp /app/migrations/014_inference_model_apply.sql /migrations/014_inference_model_apply.sql && cp /app/migrations/015_inference_instance_lifecycle.sql /migrations/015_inference_instance_lifecycle.sql && cp /app/migrations/016_inference_workload_lifecycle.sql /migrations/016_inference_workload_lifecycle.sql && cp /app/migrations/017_inference_runtime_options.sql /migrations/017_inference_runtime_options.sql
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      containers:
      - name: migrate
        image: codefactory/langgraph-service:dev
        imagePullPolicy: Always
        command: [ "python", "-m", "langgraph_service.storage.migrate" ]
        envFrom:
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: POSTGRES_ADMIN_PASSWORD
        - name: GITHUB_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: GITHUB_DB_PASSWORD
        - name: LANGGRAPH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: LANGGRAPH_DB_PASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      volumes:
      - name: migrations
        emptyDir:
          sizeLimit: 16Mi

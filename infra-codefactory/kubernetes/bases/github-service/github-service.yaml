apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-service
  labels:
    app.kubernetes.io/name: github-service
    app.kubernetes.io/part-of: codefactory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-service
        app.kubernetes.io/part-of: codefactory
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-database-migrations
        image: postgres:16.10-bookworm
        imagePullPolicy: IfNotPresent
        command: [ "sh", "-ec" ]
        args:
        - |
          until psql -X -qAt \
            --host="$GITHUB_DB_HOST" \
            --port="$GITHUB_DB_PORT" \
            --username="$GITHUB_DB_USERNAME" \
            --dbname="$GITHUB_DB_NAME" \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT to_regclass('github_service.webhook_deliveries') IS NOT NULL AND to_regclass('github_service.task_contexts') IS NOT NULL AND (SELECT ready FROM codefactory_migrations.migration_state WHERE id = 1)" | grep -qx t; do
            sleep 2
          done
        envFrom:
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: GITHUB_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: github-service
        image: codefactory/github-service:dev
        imagePullPolicy: Always
        command:
        - uvicorn
        args:
        - github_service.host:create_app
        - --factory
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: codefactory-service-config
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: GITHUB_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: codefactory-database-config
              key: GITHUB_DB_USERNAME
        - name: GITHUB_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: GITHUB_DB_PASSWORD
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: GITHUB_WEBHOOK_SECRET
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: INTERNAL_SERVICE_TOKEN
        - name: GITHUB_APP_ID
          valueFrom:
            configMapKeyRef:
              name: codefactory-github-settings
              key: GITHUB_APP_ID
        - name: GITHUB_PROJECT_OWNER
          valueFrom:
            configMapKeyRef:
              name: codefactory-github-settings
              key: GITHUB_PROJECT_OWNER
        - name: GITHUB_PROJECT_OWNER_TYPE
          valueFrom:
            configMapKeyRef:
              name: codefactory-github-settings
              key: GITHUB_PROJECT_OWNER_TYPE
        - name: GITHUB_PROJECT_NUMBER
          valueFrom:
            configMapKeyRef:
              name: codefactory-github-settings
              key: GITHUB_PROJECT_NUMBER
        - name: GITHUB_PRIVATE_KEY_PATH
          value: /var/run/secrets/github-app/private-key.pem
        volumeMounts:
        - name: github-app-key
          mountPath: /var/run/secrets/github-app
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: github-app-key
        secret:
          secretName: codefactory-github-app
          defaultMode: 440
          items:
          - key: private-key.pem
            path: private-key.pem
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: github-service
  labels:
    app.kubernetes.io/name: github-service
    app.kubernetes.io/part-of: codefactory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: github-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

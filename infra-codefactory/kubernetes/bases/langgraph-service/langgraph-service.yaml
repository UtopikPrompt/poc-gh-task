apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-service
  labels:
    app.kubernetes.io/name: langgraph-service
    app.kubernetes.io/part-of: codefactory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langgraph-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langgraph-service
        app.kubernetes.io/part-of: codefactory
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-database-migrations
        image: postgres:16.10-bookworm
        imagePullPolicy: IfNotPresent
        command: [ "sh", "-ec" ]
        args:
        - |
          until psql -X -qAt \
            --host="$LANGGRAPH_DB_HOST" \
            --port="$LANGGRAPH_DB_PORT" \
            --username="$LANGGRAPH_DB_USERNAME" \
            --dbname="$LANGGRAPH_DB_NAME" \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT to_regclass('langgraph_service.checkpoint_migrations') IS NOT NULL AND to_regclass('langgraph_service.checkpoints') IS NOT NULL AND (SELECT ready FROM codefactory_migrations.migration_state WHERE id = 1)" | grep -qx t; do
            sleep 2
          done
        envFrom:
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: LANGGRAPH_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: langgraph-service
        image: codefactory/langgraph-service:dev
        imagePullPolicy: Always
        command:
        - uvicorn
        args:
        - langgraph_service.host:create_app
        - --factory
        - --host
        - 0.0.0.0
        - --port
        - "8001"
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        envFrom:
        - configMapRef:
            name: codefactory-service-config
        - configMapRef:
            name: codefactory-database-config
        env:
        - name: LANGGRAPH_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: codefactory-database-config
              key: LANGGRAPH_DB_USERNAME
        - name: LANGGRAPH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: LANGGRAPH_DB_PASSWORD
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: codefactory-runtime-secrets
              key: INTERNAL_SERVICE_TOKEN
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-service
  labels:
    app.kubernetes.io/name: langgraph-service
    app.kubernetes.io/part-of: codefactory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: langgraph-service
  ports:
  - name: http
    port: 8001
    targetPort: http
    protocol: TCP

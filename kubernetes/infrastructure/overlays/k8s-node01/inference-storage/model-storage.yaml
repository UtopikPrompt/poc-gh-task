apiVersion: v1
kind: PersistentVolume
metadata:
  name: inference-model-artifacts
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: inference-models-local
  local:
    path: /mnt/k8s-local-nvme/inference-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-node01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-model-artifacts
  namespace: inference
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: inference-models-local
  volumeName: inference-model-artifacts
  resources:
    requests:
      storage: 500Gi

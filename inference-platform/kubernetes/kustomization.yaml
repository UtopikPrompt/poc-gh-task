apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- infrastructure/overlays/k8s-node01/inference-storage
- infrastructure/overlays/k8s-node01/model-download-worker
- infrastructure/overlays/k8s-node01/model-rollout-reconciler
- infrastructure/monitoring
configMapGenerator:
- name: inference-workload-templates
  files:
  - gpu-deployment.yaml=inference-serving/base/deployment.yaml
  - cpu-deployment.yaml=inference-serving/cpu/deployment.yaml
  options:
    disableNameSuffixHash: true
namespace: inference

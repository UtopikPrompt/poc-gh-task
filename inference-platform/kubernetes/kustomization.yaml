apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- inference-serving/base
- inference-serving/cpu
- infrastructure/overlays/k8s-node01/inference-storage
- infrastructure/overlays/k8s-node01/model-download-worker
- infrastructure/overlays/k8s-node01/model-rollout-reconciler
- infrastructure/monitoring
namespace: inference
patches:
- path: infrastructure/overlays/k8s-node01/inference-serving/node-specific.yaml
- path: infrastructure/overlays/k8s-node01/inference-serving/cpu-node-specific.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      scrape_timeout: 10s
    rule_files:
      - /etc/prometheus/rules/*.yaml
    scrape_configs:
      - job_name: inference-cadvisor
        scheme: https
        metrics_path: /api/v1/nodes/k8s-node01/proxy/metrics/cadvisor
        static_configs:
          - targets: [kubernetes.default.svc:443]
            labels:
              node: k8s-node01
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_spec_cpu_quota|container_spec_cpu_period
          - source_labels: [namespace, pod]
            action: keep
            regex: inference;llama-cpp-server-(cpu-)?[a-z0-9].+
          - source_labels: [pod]
            target_label: inference_instance
            regex: llama-cpp-server-[a-z0-9]{9,10}-[a-z0-9]{5}
            replacement: gpu
          - source_labels: [pod]
            target_label: inference_instance
            regex: llama-cpp-server-cpu-.+
            replacement: cpu
      - job_name: inference-dcgm
        honor_labels: true
        static_configs:
          - targets: [dcgm-exporter.inference.svc.cluster.local:9400]
            labels:
              inference_instance: gpu
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE
          - source_labels: [namespace, pod]
            action: keep
            regex: inference;llama-cpp-server-[a-z0-9]{9,10}-[a-z0-9]{5}
  cpu-limit-rules.yaml: |
    groups:
      - name: inference-cpu-limits
        interval: 30s
        rules:
          - record: kube_pod_container_resource_limits
            expr: container_spec_cpu_quota / container_spec_cpu_period
            labels:
              resource: cpu
              unit: core
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-prometheus
  labels:
    app.kubernetes.io/name: inference-prometheus
    app.kubernetes.io/part-of: inference-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-prometheus-kubelet-read
rules:
- apiGroups: [ "" ]
  resources: [ "nodes/proxy" ]
  verbs: [ "get" ]
  resourceNames: [ "k8s-node01" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-prometheus-kubelet-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-prometheus-kubelet-read
subjects:
- kind: ServiceAccount
  name: inference-prometheus
  namespace: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-prometheus
  labels:
    app.kubernetes.io/name: inference-prometheus
    app.kubernetes.io/part-of: inference-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-prometheus
        app.kubernetes.io/part-of: inference-platform
    spec:
      serviceAccountName: inference-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=1500MB
        - --web.listen-address=0.0.0.0:9090
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      volumes:
      - name: config
        configMap:
          name: inference-prometheus-config
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: inference-prometheus
    app.kubernetes.io/part-of: inference-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
    protocol: TCP

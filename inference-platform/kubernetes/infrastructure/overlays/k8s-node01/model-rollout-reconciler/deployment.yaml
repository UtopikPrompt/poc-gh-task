apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-model-rollout-reconciler
  labels:
    app.kubernetes.io/name: inference-model-rollout-reconciler
    app.kubernetes.io/part-of: inference-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-model-rollout-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-model-rollout-reconciler
        app.kubernetes.io/part-of: inference-platform
    spec:
      serviceAccountName: inference-model-rollout-reconciler
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: model-rollout-reconciler
        image: ghcr.io/utopikprompt/poc-gh-task-langgraph-service:dev
        imagePullPolicy: Always
        command: [ "model-rollout-reconciler" ]
        envFrom:
        - configMapRef:
            name: inference-model-reconciler-config
        env:
        - name: MODEL_RECONCILER_TOKEN
          valueFrom:
            secretKeyRef:
              name: inference-model-reconciler-credentials
              key: MODEL_RECONCILER_TOKEN
        startupProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 18
        readinessProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]

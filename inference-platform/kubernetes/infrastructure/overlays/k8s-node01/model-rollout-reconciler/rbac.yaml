apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-model-rollout-reconciler
  labels:
    app.kubernetes.io/name: inference-model-rollout-reconciler
    app.kubernetes.io/part-of: inference-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-model-rollout-reconciler
  labels:
    app.kubernetes.io/name: inference-model-rollout-reconciler
    app.kubernetes.io/part-of: inference-platform
rules:
- apiGroups: [ "apps" ]
  resources: [ "deployments" ]
  verbs: [ "get", "patch" ]
- apiGroups: [ "apps" ]
  resources: [ "deployments/status" ]
  verbs: [ "get" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-model-rollout-reconciler
  labels:
    app.kubernetes.io/name: inference-model-rollout-reconciler
    app.kubernetes.io/part-of: inference-platform
subjects:
- kind: ServiceAccount
  name: inference-model-rollout-reconciler
  namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-model-rollout-reconciler

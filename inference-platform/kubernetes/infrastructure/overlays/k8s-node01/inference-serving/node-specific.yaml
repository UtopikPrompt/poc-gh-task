apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        supplementalGroups:
        - 20000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-node01
      containers:
      - name: llama-server
        args:
        - --verbose
        - --model
        - /models/qwen2.5-32b-instruct-q4_k_m.gguf
        - --n-gpu-layers
        - all
        - --device
        - CUDA0,CUDA1
        - --split-mode
        - layer
        - --tensor-split
        - 1,1
        - --ctx-size
        - "16384"
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        resources:
          requests:
            cpu: "8"
            memory: 56Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "8"
            memory: 56Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: model-artifacts
          mountPath: /models
          readOnly: true
      volumes:
      - name: model-artifacts
        persistentVolumeClaim:
          claimName: inference-model-artifacts

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server-cpu
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-node01
      containers:
      - name: llama-server
        args:
        - --verbose
        - -m
        - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        - --device
        - none
        - --n-gpu-layers
        - "0"
        - --threads
        - "2"
        - --threads-batch
        - "2"
        - --threads-http
        - "2"
        - --ctx-size
        - "1024"
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        volumeMounts:
        - name: model-artifacts
          mountPath: /models
          readOnly: true
      volumes:
      - name: model-artifacts
        persistentVolumeClaim:
          claimName: inference-model-artifacts

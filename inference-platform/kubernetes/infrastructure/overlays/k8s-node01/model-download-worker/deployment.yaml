apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-model-download-worker
  labels:
    app.kubernetes.io/name: inference-model-download-worker
    app.kubernetes.io/part-of: inference-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-model-download-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-model-download-worker
        app.kubernetes.io/part-of: inference-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        supplementalGroups:
        - 20000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-node01
      initContainers:
      - name: wait-for-model-download-schema
        image: postgres:16.10-bookworm
        imagePullPolicy: IfNotPresent
        command: [ "sh", "-ec" ]
        args:
        - |
          until psql -X -qAt \
            --host="$LANGGRAPH_DB_HOST" \
            --port="$LANGGRAPH_DB_PORT" \
            --username="$LANGGRAPH_DB_USERNAME" \
            --dbname="$LANGGRAPH_DB_NAME" \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT to_regclass('langgraph_service.inference_instance_config') IS NOT NULL AND to_regclass('langgraph_service.inference_model_download_request') IS NOT NULL" | grep -qx t; do
            sleep 2
          done
        envFrom:
        - configMapRef:
            name: inference-model-downloader-config
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: inference-model-downloader-credentials
              key: LANGGRAPH_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      containers:
      - name: model-download-worker
        image: ghcr.io/utopikprompt/poc-gh-task-langgraph-service:dev
        imagePullPolicy: Always
        command: [ "/bin/sh", "-ec" ]
        args:
        - umask 0002; exec model-download-worker
        envFrom:
        - configMapRef:
            name: inference-model-downloader-config
        env:
        - name: LANGGRAPH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inference-model-downloader-credentials
              key: LANGGRAPH_DB_PASSWORD
        volumeMounts:
        - name: model-artifacts
          mountPath: /storage
        - name: tmp
          mountPath: /tmp
        startupProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 18
        readinessProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [ "/bin/sh", "-ec", "kill -0 1" ]
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
      volumes:
      - name: model-artifacts
        persistentVolumeClaim:
          claimName: inference-model-artifacts
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi

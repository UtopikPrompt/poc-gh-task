apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server-cpu
  labels:
    app.kubernetes.io/name: llama-cpp-server-cpu
    app.kubernetes.io/part-of: inference-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-server-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-server-cpu
        app.kubernetes.io/part-of: inference-serving
    spec:
      automountServiceAccountToken: false
      securityContext:
        supplementalGroups:
        - 20000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-node01
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp@sha256:c1d664830580e1651c1cc8d3bbc161af474800a56a83226e6e22f94bb8ba1c59
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - /models/model.gguf
        - --device
        - none
        - --n-gpu-layers
        - "0"
        - --threads
        - "2"
        - --threads-batch
        - "2"
        - --threads-http
        - "2"
        - --ctx-size
        - "1024"
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi
        volumeMounts:
        - name: model-artifacts
          mountPath: /models
          readOnly: true
      volumes:
      - name: model-artifacts
        persistentVolumeClaim:
          claimName: inference-model-artifacts
